<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Page</title>
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">
  <main class="max-w-6xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-center mb-10">About Founders</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <section id="putra" class="text-center" data-aos="fade-up">
        <img src="hutao.jpg" alt="putra" class="w-48 h-48 rounded-full object-cover mx-auto mb-4">
        <h4 class="text-xl font-semibold">Putra</h4>
        <p class="text-gray-600">Special Role: Fullstack Developer</p>
      </section>

      <section id="seanne" class="text-center" data-aos="fade-up" data-aos-delay="100">
        <img src="about.jpeg" alt="seanne" class="w-48 h-48 rounded-full object-cover mx-auto mb-4">
        <h4 class="text-xl font-semibold">Seanne</h4>
        <p class="text-gray-600">Special Role: Sharing About Events</p>
      </section>

      <section id="azuya" class="text-center" data-aos="fade-up" data-aos-delay="200">
        <img src="rafi.jpeg" alt="azuya" class="w-48 h-48 rounded-full object-cover mx-auto mb-4">
        <h4 class="text-xl font-semibold">Azuya</h4>
        <p class="text-gray-600">Special Role: Admin</p>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
